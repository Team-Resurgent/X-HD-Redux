; Every environment: GCC 14.2.1 (Arm GNU Toolchain 14.2.Rel1). PlatformIO's ststm32 default
; was GCC 7.2.1 (2017).
[env]
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.140201.0

; App build environment
[env:application_stm32f0]
platform = ststm32
board = xboxhdmi_stm32f03
framework = stm32cube
board_build.ldscript = src/application/application.ld
; The startup file is the project's own (src/shared/stm32f0/startup_stm32f030x8.S, linked
; by scripts/lto.py), not the framework's library -- see the -flto note below.
board_build.stm32cube.custom_system_setup = yes

build_src_filter =
    +<application/*.c>
    +<shared/app_header.c>
    +<shared/smbus_slave_common.c>
    +<shared/adv7511.c>
    +<shared/adv7511_edid.c>
    +<shared/adv7511_i2c.c>
    +<shared/i2c1.c>
    +<shared/adv7511_xbox.c>
    +<shared/crc32.c>
    +<shared/udiv.S>
    +<shared/debug.c>
    +<shared/error_handler.c>
    +<shared/flash.c>
    +<shared/gpio.c>
    +<shared/procamp.c>
    +<shared/user_config.c>
    +<shared/vic_arbiter.c>
    +<shared/xbox_mode_index.c>
    +<shared/xbox_video_standalone.c>
    +<shared/xbox_timing_rows.c>
    +<shared/xbox_video_timing.c>
    +<shared/xbox_eeprom_video.c>
    +<shared/stm32f0/*.c>

; -flto (application only; scripts/lto.py adds it to the link and checks the result). It
; saves ~2.5 KB. Used naively it silently replaces every real interrupt handler with
; the do-nothing Default_Handler (dead board): the vector table and its weak handler aliases
; came from the framework's prebuilt FrameworkCMSISDevice library, which the linker pulls in
; only after LTO has already resolved -- and dropped -- the real handlers. Fixed
; by linking the project's own startup file as a plain object ahead of every other one
; (custom_system_setup above; after them it still collapses). scripts/lto.py does that and
; fails the build if any handler still resolves to Default_Handler.
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--no-warn-rwx-segments
    -specs=nano.specs
    -specs=nosys.specs
    -Isrc
    -Isrc/application
    -Isrc/shared
    -Isrc/shared/stm32f0
    -DBUILD_APPLICATION
    ; the mode tables are read from the bootloader (src/shared/xbox_timing_rows.h)
    -DXHD_TIMING_TABLES_EXTERNAL
    -flto

extra_scripts =
    pre:scripts/inject_git_version.py
    pre:scripts/hal_overrides.py
    post:scripts/lto.py

; Bootloader build environment
[env:bootloader_stm32f0]
platform = ststm32
board = xboxhdmi_stm32f03
framework = stm32cube
board_build.ldscript = src/bootloader/bootloader.ld

build_src_filter =
    +<bootloader/*.c>
    +<shared/app_header.c>
    +<shared/xbox_timing_rows.c>
    +<shared/smbus_slave_common.c>
    +<shared/adv7511.c>
    +<shared/adv7511_edid.c>
    +<shared/adv7511_i2c.c>
    +<shared/i2c1.c>
    +<shared/adv7511_xbox.c>
    +<shared/crc32.c>
    +<shared/udiv.S>
    +<shared/debug.c>
    +<shared/error_handler.c>
    +<shared/flash.c>
    +<shared/gpio.c>
    +<shared/user_config.c>
    +<shared/stm32f0/*.c>

; The bootloader's recovery video (src/bootloader/bl_video.c) picks a mode from the latched
; encoder, the pixel clock and 0x3E, and takes its timing from the application's own tables
; (shared/xbox_timing_rows.c, uncalibrated). It does NOT compile xbox_video_timing.c /
; xbox_video_standalone.c (calibration, the EEPROM and the arbiter family model live in the
; app build only), which keeps room for the UART firmware updater
; (src/bootloader/bl_uart_update.c). shared/app_header.c is the image CRC check
; can_launch_application() runs before starting the application.

; DO NOT add -flto here. It builds clean (0 errors/warnings) and saves
; real flash space (~4KB app, ~4KB bootloader), but silently replaces every real interrupt
; handler (SysTick_Handler, I2C2_IRQHandler, EXTI4_15_IRQHandler, USART2_IRQHandler) with
; the do-nothing Default_Handler -- confirmed via `arm-none-eabi-nm firmware.elf`, which
; showed all four collapsed onto Default_Handler's address instead of their real
; implementations. Fully dead board: no timing, no Xbox SMBus, no line detection, no UART
; console. Root cause: the vector table lives in a prebuilt, non-LTO static library
; (FrameworkCMSISDevice); something in that mixed LTO/non-LTO link keeps the weak default
; over the real override. If this is ever revisited, verify with the same nm check BEFORE
; flashing anything.
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--no-warn-rwx-segments
    -specs=nano.specs
    -specs=nosys.specs
    -Isrc
    -Isrc/bootloader
    -Isrc/shared
    -Isrc/shared/stm32f0
    -DBUILD_BOOTLOADER

extra_scripts =
    pre:scripts/inject_git_version.py
    pre:scripts/hal_overrides.py

[env:combined_stm32f0]
platform = ststm32
board = xboxhdmi_stm32f03
framework = stm32cube

build_src_filter =
    +<shared/dummy.c>

extra_scripts =
    scripts/combine_firmware.py
