; App build environment
[env:application_stm32f0]
platform = ststm32
board = xboxhdmi_stm32f03
framework = stm32cube
board_build.ldscript = src/application/application.ld

build_src_filter =
    +<application/*.c>
    +<shared/smbus_slave_common.c>
    +<shared/adv7511.c>
    +<shared/adv7511_edid.c>
    +<shared/adv7511_i2c.c>
    +<shared/adv7511_xbox.c>
    +<shared/crc32.c>
    +<shared/debug.c>
    +<shared/error_handler.c>
    +<shared/flash.c>
    +<shared/gpio.c>
    +<shared/user_config.c>
    +<shared/vic_arbiter.c>
    +<shared/xbox_mode_index.c>
    +<shared/xbox_video_standalone.c>
    +<shared/xbox_video_timing.c>
    +<shared/xbox_eeprom_video.c>
    +<shared/stm32f0/*.c>

; DO NOT add -flto here. Tested 2026-08-25: it builds clean (0 errors/warnings) and saves
; real flash space (~4KB app, ~4KB bootloader), but silently replaces every real interrupt
; handler (SysTick_Handler, I2C2_IRQHandler, EXTI4_15_IRQHandler, USART2_IRQHandler) with
; the do-nothing Default_Handler -- confirmed via `arm-none-eabi-nm firmware.elf`, which
; showed all four collapsed onto Default_Handler's address instead of their real
; implementations. Fully dead board: no timing, no Xbox SMBus, no line detection, no UART
; console. Root cause: the vector table lives in a prebuilt, non-LTO static library
; (FrameworkCMSISDevice); something in that mixed LTO/non-LTO link keeps the weak default
; over the real override. If this is ever revisited, verify with the same nm check BEFORE
; flashing anything.
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -specs=nano.specs
    -specs=nosys.specs
    -Isrc
    -Isrc/application
    -Isrc/shared
    -Isrc/shared/stm32f0
    -DBUILD_APPLICATION

extra_scripts =
    pre:scripts/inject_git_version.py
    pre:scripts/hal_overrides.py

; Bootloader build environment
[env:bootloader_stm32f0]
platform = ststm32
board = xboxhdmi_stm32f03
framework = stm32cube
board_build.ldscript = src/bootloader/bootloader.ld

build_src_filter =
    +<bootloader/*.c>
    +<shared/smbus_slave_common.c>
    +<shared/adv7511.c>
    +<shared/adv7511_edid.c>
    +<shared/adv7511_i2c.c>
    +<shared/adv7511_xbox.c>
    +<shared/crc32.c>
    +<shared/debug.c>
    +<shared/error_handler.c>
    +<shared/flash.c>
    +<shared/gpio.c>
    +<shared/user_config.c>
    +<shared/stm32f0/*.c>

; The bootloader's cold-start video is a minimal 0x3E-follow (src/bootloader/bl_video.c)
; with fixed Xcalibur-column timing -- it does NOT compile xbox_video_standalone.c /
; xbox_video_timing.c (the per-encoder tables + arbiter family model live in the app
; build only). That freed the flash for the UART firmware updater
; (src/bootloader/bl_uart_update.c). xbox_eeprom_video.c went with them: its only
; bootloader consumer was xbox_video_timing.c's sd_resolve_widescreen().

; DO NOT add -flto here. Tested 2026-08-25: it builds clean (0 errors/warnings) and saves
; real flash space (~4KB app, ~4KB bootloader), but silently replaces every real interrupt
; handler (SysTick_Handler, I2C2_IRQHandler, EXTI4_15_IRQHandler, USART2_IRQHandler) with
; the do-nothing Default_Handler -- confirmed via `arm-none-eabi-nm firmware.elf`, which
; showed all four collapsed onto Default_Handler's address instead of their real
; implementations. Fully dead board: no timing, no Xbox SMBus, no line detection, no UART
; console. Root cause: the vector table lives in a prebuilt, non-LTO static library
; (FrameworkCMSISDevice); something in that mixed LTO/non-LTO link keeps the weak default
; over the real override. If this is ever revisited, verify with the same nm check BEFORE
; flashing anything.
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -specs=nano.specs
    -specs=nosys.specs
    -Isrc
    -Isrc/bootloader
    -Isrc/shared
    -Isrc/shared/stm32f0
    -DBUILD_BOOTLOADER

extra_scripts =
    pre:scripts/inject_git_version.py
    pre:scripts/hal_overrides.py

[env:combined_stm32f0]
platform = ststm32
board = xboxhdmi_stm32f03
framework = stm32cube

build_src_filter =
    +<shared/dummy.c>

extra_scripts =
    scripts/combine_firmware.py
